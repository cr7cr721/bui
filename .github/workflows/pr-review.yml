name: PR Review Agent

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    branches: [development]

permissions:
  pull-requests: write
  contents: read

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: arc-runners

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate review script exists
        run: test -f .github/scripts/pr-review.mjs

      - name: Validate context builder exists
        run: test -f .github/scripts/build-context.mjs

      - name: Skip if already reviewed for this commit
        id: dedupe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_API_URL: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          reviews_json=$(curl -s \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GH_API_URL/repos/$REPO/pulls/$PR_NUMBER/reviews?per_page=100")
          if echo "$reviews_json" | grep -q "\"commit_id\":\"$COMMIT_SHA\""; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already reviewed commit $COMMIT_SHA, skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build context inputs
        if: steps.dedupe.outputs.skip != 'true'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/build-context.mjs

      - name: Validate LLM env
        if: steps.dedupe.outputs.skip != 'true'
        shell: bash
        env:
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_VERSION: ${{ vars.AZURE_OPENAI_API_VERSION }}
          AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT }}
        run: |
          set -euo pipefail

          missing=0
          for k in AZURE_OPENAI_API_KEY AZURE_OPENAI_ENDPOINT AZURE_OPENAI_API_VERSION AZURE_OPENAI_DEPLOYMENT; do
            if [ -z "${!k:-}" ]; then
              echo "Missing required Azure config: $k"
              missing=1
            fi
          done

          if [ "$missing" -eq 1 ]; then
            exit 1
          fi

          echo "Azure OpenAI env looks good."

      - name: Build AI container
        if: steps.dedupe.outputs.skip != 'true'
        run: docker build -f Dockerfile.ai -t beam-ai-runner .

      - name: Run LLM review in container
        if: steps.dedupe.outputs.skip != 'true'
        env:
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_VERSION: ${{ vars.AZURE_OPENAI_API_VERSION }}
          AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_API_URL: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -v /tmp/pr.diff:/tmp/pr.diff \
            -v /tmp/specs.txt:/tmp/specs.txt \
            -v /tmp/review-findings.json:/tmp/review-findings.json \
            -w /workspace \
            -e AZURE_OPENAI_API_KEY="$AZURE_OPENAI_API_KEY" \
            -e AZURE_OPENAI_ENDPOINT="$AZURE_OPENAI_ENDPOINT" \
            -e AZURE_OPENAI_API_VERSION="$AZURE_OPENAI_API_VERSION" \
            -e AZURE_OPENAI_DEPLOYMENT="$AZURE_OPENAI_DEPLOYMENT" \
            -e GH_TOKEN="$GH_TOKEN" \
            -e GH_API_URL="$GH_API_URL" \
            -e REPO="$REPO" \
            -e PR_NUMBER="$PR_NUMBER" \
            -e COMMIT_SHA="$COMMIT_SHA" \
            beam-ai-runner node .github/scripts/pr-review.mjs

      - name: Trigger fix agent
        if: steps.dedupe.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_HOST: ghosthub.corp.blizzard.net
        run: |
          gh workflow run pr-fix.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ github.head_ref }}" \
            --field pr_number="${{ github.event.pull_request.number }}" \
            --field head_sha="${{ github.event.pull_request.head.sha }}" \
            --field head_branch="${{ github.head_ref }}"
