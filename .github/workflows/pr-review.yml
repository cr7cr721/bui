name: PR Review Agent

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    branches: [development, pr-review-agent]

permissions:
  pull-requests: write
  contents: read
  actions: write

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bootstrap:
    name: Bootstrap PR Review Agent
    runs-on: ubuntu-latest
    steps:
      - run: echo "PR Review Agent workflow triggered for PR #${{ github.event.pull_request.number }}"

  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: arc-runners
    needs: bootstrap

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate review script exists
        run: test -f .github/scripts/pr-review.mjs

      - name: Validate context builder exists
        run: test -f .github/scripts/build-context.mjs

      - name: Skip if already reviewed for this commit
        id: dedupe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_API_URL: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          reviews_json=$(curl -s \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GH_API_URL/repos/$REPO/pulls/$PR_NUMBER/reviews?per_page=100")
          if echo "$reviews_json" | grep -q "\"commit_id\":\"$COMMIT_SHA\""; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already reviewed commit $COMMIT_SHA, skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build context inputs
        if: steps.dedupe.outputs.skip != 'true'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/build-context.mjs

      - name: Validate LLM env
        if: steps.dedupe.outputs.skip != 'true'
        shell: bash
        env:
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_VERSION: ${{ vars.AZURE_OPENAI_API_VERSION }}
          AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT }}
        run: |
          set -euo pipefail
          missing=0
          for k in AZURE_OPENAI_API_KEY AZURE_OPENAI_ENDPOINT AZURE_OPENAI_API_VERSION AZURE_OPENAI_DEPLOYMENT; do
            if [ -z "${!k:-}" ]; then
              echo "Missing required Azure config: $k"
              missing=1
            fi
          done
          [ "$missing" -eq 1 ] && exit 1 || true
          echo "Azure OpenAI env looks good."

      - name: Run PR review
        if: steps.dedupe.outputs.skip != 'true'
        shell: bash
        env:
          AZURE_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_API_BASE: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_API_VERSION: ${{ vars.AZURE_OPENAI_API_VERSION }}
          AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_API_URL: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          node .github/scripts/pr-review.mjs

      - name: Resolve fix workflow path
        if: steps.dedupe.outputs.skip != 'true'
        id: fix_workflow
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_API_URL: ${{ github.api_url }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for candidate in \
            .github/workflows/pr-fix.yml \
            .github/workflows/pr-fix.yaml \
            pr-fix.yml \
            pr-fix.yaml; do
            code=$(curl -sS -o /tmp/workflow.out -w "%{http_code}" \
              -H "Authorization: token ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${GH_API_URL}/repos/${REPO}/contents/${candidate}")
            if [ "$code" = "200" ]; then
              echo "workflow_path=$candidate" >> "$GITHUB_OUTPUT"
              echo "Found fix workflow at $candidate"
              exit 0
            fi
          done
          echo "Could not resolve fix workflow path"
          cat /tmp/workflow.out || true
          exit 1

      - name: Trigger fix agent
        if: steps.dedupe.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_API_URL: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FIX_WORKFLOW_PATH: ${{ steps.fix_workflow.outputs.workflow_path }}
        run: |
          set -euo pipefail

          payload=$(cat <<JSON
          {
            "ref": "${HEAD_BRANCH}",
            "inputs": {
              "pr_number": "${PR_NUMBER}",
              "head_sha": "${HEAD_SHA}",
              "head_branch": "${HEAD_BRANCH}"
            }
          }
JSON
          )

          http_code=$(curl -sS -o /tmp/dispatch.out -w "%{http_code}" \
            -X POST \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "${GH_API_URL}/repos/${REPO}/actions/workflows/${FIX_WORKFLOW_PATH}/dispatches" \
            -d "${payload}")

          if [ "${http_code}" != "204" ]; then
            echo "Warning: failed to dispatch pr-fix workflow. HTTP ${http_code}"
            cat /tmp/dispatch.out
            exit 0
          fi

          echo "pr-fix workflow dispatched successfully."
