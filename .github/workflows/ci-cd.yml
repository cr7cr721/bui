name: CI/CD Pipeline

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]

jobs:
  review-agent:
    name: PR Review Agent
    runs-on: arc-runners
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate review script exists
        run: test -f .github/scripts/pr-review.mjs

      - name: Validate context builder exists
        run: test -f .github/scripts/build-context.mjs

      - name: Build context inputs
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/build-context.mjs

      - name: Validate LLM env
        shell: bash
        env:
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_VERSION: ${{ vars.AZURE_OPENAI_API_VERSION }}
          AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT }}
        run: |
          set -euo pipefail
          missing=0
          for k in AZURE_OPENAI_API_KEY AZURE_OPENAI_ENDPOINT AZURE_OPENAI_API_VERSION AZURE_OPENAI_DEPLOYMENT; do
            if [ -z "${!k:-}" ]; then
              echo "Missing required Azure config: $k"
              missing=1
            fi
          done
          [ "$missing" -eq 1 ] && exit 1 || true
          echo "Azure OpenAI env looks good."

      - name: Run PR review
        shell: bash
        env:
          AZURE_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_API_BASE: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_API_VERSION: ${{ vars.AZURE_OPENAI_API_VERSION }}
          AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_API_URL: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          node .github/scripts/pr-review.mjs

  test:
    runs-on: arc-runners

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Yarn
        run: npm install -g yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run linting
        run: yarn lint

      - name: Run type checking
        run: yarn tsc --noEmit

      - name: Run tests
        run: yarn test --run

      - name: Build application
        run: yarn build

  build-and-push-docker:
    runs-on: arc-runners
    needs: test
    if: github.ref == 'refs/heads/development'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2
        id: checkout

      - name: Docker metadata
        id: meta
        uses: sre-actions/docker_metadata-action@v5.5.1
        with:
          images: |
            docker-hub.battle.net/gdp/beam-ui-v2
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=long

      - name: Docker build and push
        uses: sre-actions/docker_build-push-action@v6.9.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ steps.checkout.outputs.commit }}

  deploy:
    runs-on: arc-runners
    needs: build-and-push-docker
    if: github.ref == 'refs/heads/development'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2
        id: checkout

      - name: Deploy to Development
        id: deploy
        uses: bkp/deploy-action@v3.1.2
        with:
          tenant: data
          app_name: gdp-beam-ui
          deploy_target: dev
          docker_image: docker-hub.battle.net/gdp/beam-ui-v2
          docker_image_tag: sha-${{ steps.checkout.outputs.commit }}
          target_clusters: gke-dev-usc1-gke-telemetry-02

      - name: Deployment Summary
        run: |
          echo "🚀 Deployment completed successfully!"
          echo "📦 App: gdp-beam-ui"
          echo "🎯 Target: dev" 
          echo "🏷️  Image: docker-hub.battle.net/gdp/beam-ui-v2:sha-${{ steps.checkout.outputs.commit }}"
          echo "☸️  Cluster: gke-dev-usc1-gke-telemetry-02"
          echo "🌐 URL: https://gdp-beam-ui.dev.data.blz.dev/"
          echo "📝 Commit: ${{ steps.checkout.outputs.commit }}"

      - name: Health Check
        run: |
          echo "🏥 Performing health check..."
          sleep 30  # Wait for deployment to settle

          # Check if the application is responding
          if curl -f -s https://gdp-beam-ui.dev.data.blz.dev/ > /dev/null; then
            echo "✅ Health check passed - Application is responding"
            echo "🌟 Deployment verified successful!"
          else
            echo "⚠️  Health check failed - Application may still be starting"
            echo "ℹ️  Check the deployment status manually if needed"
          fi
        continue-on-error: true
