name: CI/CD Pipeline

on:
  push:
    branches: [ development ]
  pull_request:
    branches: [ development ]

jobs:
  test:
    runs-on: arc-runners

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Yarn
        run: npm install -g yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run linting
        run: yarn lint

      - name: Run type checking
        run: yarn tsc --noEmit

      - name: Run tests
        run: yarn test

      - name: Build application
        run: yarn build

  build-and-push-docker:
    runs-on: arc-runners
    needs: test
    if: github.ref == 'refs/heads/development'

    steps:
      - uses: actions/checkout@v4.2.2
        id: checkout

      - name: Docker metadata
        id: meta
        uses: sre-actions/docker_metadata-action@v5.5.1
        with:
          images: |
            docker-hub.battle.net/gdp/beam-ui-v2
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=long

      - name: Docker build and push
        uses: sre-actions/docker_build-push-action@v6.9.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ steps.checkout.outputs.commit }}

  deploy:
    runs-on: arc-runners
    needs: build-and-push-docker
    if: github.ref == 'refs/heads/development'

    steps:
      - name: Deploy to development
        run: |
          echo "Deploying to development server..."
          echo "Image: docker-hub.battle.net/gdp/beam-ui-v2:development"
          # Add your deployment commands here