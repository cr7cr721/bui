name: PR Fix Agent

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to fix
        required: true
      head_sha:
        description: Commit SHA that was reviewed
        required: true
      head_branch:
        description: PR head branch to check out and push fixes to
        required: true

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: pr-fix-${{ inputs.head_sha }}
  cancel-in-progress: true

jobs:
  fix:
    name: Apply AI review fixes
    runs-on: arc-runners

    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_branch }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          persist-credentials: true

      - name: Validate fix script exists
        run: test -f .github/scripts/pr-fix.mjs

      - name: Validate context builder exists
        run: test -f .github/scripts/build-context.mjs

      - name: Skip if already fixed this reviewed commit
        id: dedupe
        env:
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          if git log --oneline --all | grep -q "\[ai-fix source=$HEAD_SHA\]"; then
            echo "Already applied AI fix for commit $HEAD_SHA — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build context inputs
        if: steps.dedupe.outputs.skip != 'true'
        env:
          COMMIT_SHA: ${{ inputs.head_sha }}
        run: node .github/scripts/build-context.mjs

      - name: Configure git identity
        if: steps.dedupe.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run AI fix agent
        if: steps.dedupe.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_API_URL: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
          AZURE_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_API_BASE: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_API_VERSION: ${{ vars.AZURE_OPENAI_API_VERSION }}
          AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT }}
        run: |
          set -euo pipefail
          node .github/scripts/pr-fix.mjs
